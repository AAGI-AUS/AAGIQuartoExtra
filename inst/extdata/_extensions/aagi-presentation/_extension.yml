# ========================= TEMPLATE METADATA =============================
# General metadata about the template, including title, author, and version.
title: AAGI-presentation
author: Adam H. Sparks, James J Balamuta, Russel Edson, Vinh Thiem Ma, Rose Megirian, Zhanglong Cao, Sam Rogers, Julian Taylor
# Adapted by Javier A. Fernandez to the AAGIQuartoExtra package
version: 1.0.1
quarto-required: ">=1.4.0"

# ======================== FORMATS & CONFIGURATION ========================
# Contributes section configures specific formats (pdf, docx) for the template.
contributes:
  formats:
    # ----------------------- PDF CONFIGURATION ---------------------------
    pptx:
      reference-doc: assets/template.pptx
      toc: true
      number-sections: false
      incremental: true

    # ----------------------- DOCX CONFIGURATION --------------------------
    revealjs:
      theme:
        - default
        - assets/aagi.scss

      include-after-body: theme.html

      # stage extension assets and reference them by basename
      format-resources:
        - assets/AAGI_logo.svg
        - assets/title-slide-main.png

      logo: AAGI_logo.svg
      title-slide-attributes:
        data-background-image: title-slide-main.png
        data-background-size: 1050px auto
        data-background-position: 50% 85%

      date-format: long
      slide-number: true
      footer: ""
      highlight-style: breeze
      overview: true
      progress: true
      touch: true
      chalkboard: true
      execute:
        echo: true
